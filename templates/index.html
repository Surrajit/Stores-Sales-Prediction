<!DOCTYPE html>
<html>
<head>
    <title>Big Mart Sales Prediction</title>
</head>
<body>
    <h1>Big Mart Sales Prediction</h1>
    <form method="POST">
        <label>Item Weight:</label><input type="number" name="item_weight" value="9.3" step="0.1"><br>
        <label>Item Fat Content:</label>
        <select name="item_fat_content">
            <option value="Low Fat">Low Fat</option>
            <option value="Regular">Regular</option>
        </select><br>
        <label>Item Visibility:</label><input type="number" name="item_visibility" value="0.016" step="0.001" min="0" max="1"><br>
        <label>Item Type:</label>
        <select name="item_type">
            <option value="Dairy">Dairy</option>
            <option value="Soft Drinks">Soft Drinks</option>
            <option value="Meat">Meat</option>
            <!-- Add more as needed -->
        </select><br>
        <label>Item MRP:</label><input type="number" name="item_mrp" value="249.8" step="0.1"><br>
        <label>Outlet Establishment Year:</label><input type="number" name="outlet_year" value="1999" min="1900" max="2025"><br>
        <label>Outlet Size:</label>
        <select name="outlet_size">
            <option value="">None</option>
            <option value="Small">Small</option>
            <option value="Medium">Medium</option>
            <option value="High">High</option>
        </select><br>
        <label>Outlet Location Type:</label>
        <select name="outlet_location">
            <option value="Tier 1">Tier 1</option>
            <option value="Tier 2">Tier 2</option>
            <option value="Tier 3">Tier 3</option>
        </select><br>
        <label>Outlet Type:</label>
        <select name="outlet_type">
            <option value="Supermarket Type1">Supermarket Type1</option>
            <option value="Supermarket Type2">Supermarket Type2</option>
            <option value="Supermarket Type3">Supermarket Type3</option>
            <option value="Grocery Store">Grocery Store</option>
        </select><br>
        <label>Outlet Identifier:</label>
        <select name="outlet_identifier">
            <option value="OUT010">OUT010</option>
            <option value="OUT013">OUT013</option>
            <option value="OUT017">OUT017</option>
            <option value="OUT018">OUT018</option>
            <option value="OUT019">OUT019</option>
            <option value="OUT027">OUT027</option>
            <option value="OUT035">OUT035</option>
            <option value="OUT045">OUT045</option>
            <option value="OUT046">OUT046</option>
            <option value="OUT049">OUT049</option>
        </select><br>
        <input type="submit" value="Predict Sales">
    </form>
    {% if prediction %}
    <h3 style="color: green;">{{ prediction }}</h3>
    {% endif %}
</body>
</html>
